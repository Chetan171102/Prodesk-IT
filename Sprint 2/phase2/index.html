<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cash-Flow | Phase 2</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1> Cash-Flow Tracker</h1>
  <p class="subtitle">Phase 2 — Data Persistence & Chart</p>

  <!-- ERROR MESSAGE -->
  <p id="errorMsg" class="error"></p>

  <!-- THRESHOLD WARNING -->
  <div id="warningBox" class="warning-box" style="display:none;">
     Warning: Your balance is below 10% of your salary!
  </div>

  <!-- SALARY SECTION -->
  <div class="box">
    <h2>Set Salary</h2>
    <input type="number" id="salaryInput" placeholder="Enter your salary" />
    <button onclick="setSalary()">Set Salary</button>
  </div>

  <!-- EXPENSE SECTION -->
  <div class="box">
    <h2>Add Expense</h2>
    <input type="text"   id="expenseName"   placeholder="Expense name (e.g. Rent)" />
    <input type="number" id="expenseAmount" placeholder="Expense amount" />
    <button onclick="addExpense()">Add Expense</button>
  </div>

  <!-- SUMMARY -->
  <div class="box">
    <h2>Summary</h2>
    <p>Total Salary: <strong id="showSalary">₹0</strong></p>
    <p>Total Expenses: <strong id="showExpenses">₹0</strong></p>
    <p>Remaining Balance: <strong id="showBalance" >₹0</strong></p>
  </div>

  <!-- PIE CHART -->
  <div class="box">
    <h2>Balance Chart</h2>
    <canvas id="myChart" width="300" height="300"></canvas>
  </div>

  <!-- EXPENSE LIST -->
  <div class="box">
    <h2>Expense List</h2>
    <button onclick="clearAll()" class="clear-btn">Clear All Data</button>
    <ul id="expenseList">
      <li>No expenses added yet.</li>
    </ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
